subprojects {
    repositories {
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.springframework.boot'
                    && (details.requested.version == null || details.requested.version.isEmpty())) {
                details.useVersion('2.7.18')
                details.because('Ensure Spring Boot dependencies resolve with the pinned version.')
            }
        }
    }
}
