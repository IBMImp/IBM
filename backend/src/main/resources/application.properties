server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:${DB_HOST}}:${PGPORT:${DB_PORT}}/${PGDATABASE:${DB_NAME}}
spring.datasource.username=${PGUSER:${DB_USER}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

app.data.path=${APP_DATA_PATH:../virtualPatientData/pwdb/PWs/SQL/pressure_waveforms.db}
app.sample-rate-hz=${APP_SAMPLE_RATE_HZ:1000}

